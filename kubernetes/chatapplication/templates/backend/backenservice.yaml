apiVersion: v1
kind: Service
metadata:
  name: {{ include "chatapplication.backendfullname" . }}
  labels:
    {{- include "chatapplication.backendlabels" . | nindent 4 }}

spec:
  type: {{ .Values.backend.service.type }}

  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http

  selector:
    {{- include "chatapplication.backendselectorLabels" . | nindent 4 }}