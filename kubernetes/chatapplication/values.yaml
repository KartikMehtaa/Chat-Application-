# =======================
# Global Labels (Optional but Recommended)
# =======================
global:
  appName: chatapplication

# =======================
# Backend Configuration
# =======================
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: kartikmehta/backend
    tag: latest
    pullPolicy: always

  service:
    type: ClusterIP
    port: 5000

  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"

  labels:
    app: backend

  selectorLabels:
    app: backend

# =======================
# Frontend Configuration
# =======================
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: kartikmehta/frontend
    tag: latest
    pullPolicy: always

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30007   # exposed port

  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"

  labels:
    app: frontend

  selectorLabels:
    app: frontend

# =======================
# MongoDB Configuration
# =======================
mongodb:
  enabled: true
  replicaCount: 1

  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 27017

  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"

  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: standard   # change if needed

  labels:
    app: mongodb

  selectorLabels:
    app: mongodb

# =======================
# Service Account
# =======================
serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

# =======================
# Ingress (Optional)
# =======================
ingress:
  enabled: false

  className: ""
  annotations: {}

  hosts:
    - host: chatapp.local
      paths:
        - path: /
          pathType: Prefix

  tls: []